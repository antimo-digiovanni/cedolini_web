{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Portale Cedolini{% endblock %}</title>
  <link rel="manifest" href="{% url 'employee_webmanifest' %}">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cedolini SV">
  <link rel="icon" type="image/png" sizes="16x16" href="{% url 'favicon_16_png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% url 'favicon_32_png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'portal/icons/icon-192.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'portal/icons/icon-512.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'portal/icons/icon-192.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% url 'apple_touch_icon' %}">
  <link rel="apple-touch-icon-precomposed" href="{% url 'apple_touch_icon_precomposed' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'portal/portal-theme.css' %}">
  <link rel="stylesheet" href="{% static 'portal/portal-auth.css' %}">
</head>
<body class="public-portal-page">
  <header class="auth-brand-header">
    <a href="{% url 'login' %}" class="auth-brand-link">
      <img src="{% static 'portal/logo.png' %}" alt="" width="40" height="40">
      <div><strong>San Vincenzo S.r.l.</strong><span>Portale del personale</span></div>
    </a>
  </header>
  <main class="container py-5 auth-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="auth-footer"><span>San Vincenzo S.r.l.</span><span>Sistema sviluppato da <strong>Antimo Di Giovanni</strong></span></footer>
</body>
</html>
