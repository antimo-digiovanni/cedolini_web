{% comment %}Avatar di un dipendente: foto profilo se c'è, altrimenti le iniziali. Parametri: emp, size (px).{% endcomment %}
{% if emp.photo %}<img src="{% url 'profile_photo' emp.id %}?v={{ emp.photo_updated_at|date:'U' }}" alt="" width="{{ size|default:40 }}" height="{{ size|default:40 }}" loading="lazy" style="width:{{ size|default:40 }}px;height:{{ size|default:40 }}px;border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle;background:#eef1f6">{% else %}<span aria-hidden="true" style="width:{{ size|default:40 }}px;height:{{ size|default:40 }}px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c6cf0 0%,#7c4ddb 100%);color:#fff;font-weight:800;font-size:calc({{ size|default:40 }}px * .38);vertical-align:middle">{{ emp.initials }}</span>{% endif %}
