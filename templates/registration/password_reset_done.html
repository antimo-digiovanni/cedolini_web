{% extends "portal/public_base.html" %}
{% block title %}Controlla la tua email{% endblock %}
{% block content %}
<div class="auth-shell">
  <section class="auth-panel mx-auto">
    <h1 class="mb-3">Controlla la tua email</h1>
    <p class="text-muted mb-4">Se l'indirizzo inserito &egrave; presente nel sistema, riceverai un'email con il link per reimpostare la password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Torna al login</a>
  </section>
</div>
{% endblock %}
